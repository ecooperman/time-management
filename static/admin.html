<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings - Time Management</title>
  <link rel="stylesheet" href="https://static.evancooperman.com/theme.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="admin-app">
    <div id="admin-header">
      <h1>Settings</h1>
    </div>

    <nav class="app-nav">
      <a href="/" class="app-nav-link">
        <span class="app-nav-icon" data-icon="calendar" aria-hidden="true"></span>
        Planner
      </a>
      <a href="/jobs.html" class="app-nav-link">
        <span class="app-nav-icon" aria-hidden="true" data-icon="briefcase"></span>
        Jobs
      </a>
      <a href="/admin.html" class="app-nav-link active">
        <span class="app-nav-icon" aria-hidden="true" data-icon="tag"></span>
        Settings
      </a>
      <button type="button" class="app-nav-link" onclick="location.reload()">
        <span class="app-nav-icon" aria-hidden="true" data-icon="refresh"></span>
        Refresh
      </button>
    </nav>

    <div id="page-message" class="page-message hidden"></div>

    <h2 class="admin-section-heading">Categories</h2>
    <div id="category-rows"></div>

    <form id="add-category-form" class="category-row new-category-row">
      <input type="color" id="new-category-color" value="#4C7CAF" />
      <input type="text" id="new-category-name" placeholder="New category name" required />
      <button type="submit">Add category</button>
    </form>

    <h2 class="admin-section-heading">People</h2>
    <p class="note">
      Tag jobs by who they belong to (e.g. you and a partner sharing this
      app). Purely a label - everyone can still see every job, use the
      owner filter on the Jobs page to narrow the view.
    </p>
    <div id="person-rows"></div>

    <form id="add-person-form" class="category-row new-category-row">
      <input type="color" id="new-person-color" value="#4C7CAF" />
      <input type="text" id="new-person-name" placeholder="New person's name" required />
      <button type="submit">Add person</button>
    </form>
  </div>

  <div id="app-version"></div>

  <script src="https://static.evancooperman.com/theme.js"></script>
  <script src="https://static.evancooperman.com/icons.js"></script>
  <script src="/admin.js"></script>
  <script src="/version.js"></script>
</body>
</html>
