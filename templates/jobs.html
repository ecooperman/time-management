<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Jobs - Time Management</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="admin-app">
    <div id="admin-header">
      <h1>Manage Jobs</h1>
    </div>

<div id="app-nav-mount"></div>

    <div id="page-message" class="page-message hidden"></div>

    <button id="show-add-job" type="button" class="add-toggle">+ Add New Job Opportunity</button>

    <div id="import-jobs-row">
      <label for="import-jobs-file" class="add-toggle secondary">Import Jobs from CSV</label>
      <input type="file" id="import-jobs-file" accept=".csv" class="visually-hidden" />
      <label id="import-owner-label">
        as
        <select id="import-owner-select">
          <option value="">No owner</option>
        </select>
      </label>
    </div>

    <form id="add-job-form" class="item-card job-admin-card hidden">
      <div class="job-admin-fields">
        <label>
          Name
          <input type="text" id="new-job-name" required />
        </label>
        <label>
          Company <span class="hint">(optional)</span>
          <input type="text" id="new-job-company" />
        </label>
        <label>
          URL
          <input type="url" id="new-job-url" required />
        </label>
        <label>
          Company URL <span class="hint">(optional)</span>
          <input type="url" id="new-job-company-url" />
        </label>
        <label>
          Owner <span class="hint">(optional)</span>
          <select id="new-job-owner">
            <option value="">No owner</option>
          </select>
        </label>
      </div>
      <div class="job-admin-actions">
        <button type="submit">Add job</button>
        <button type="button" id="cancel-add-job">Cancel</button>
      </div>
    </form>

    <div id="job-filter-bar">
      <div id="job-tier-filters">
        <button type="button" class="tier-filter-btn tier-strong" data-tier="Strong">Strong</button>
        <button type="button" class="tier-filter-btn tier-good" data-tier="Good">Good</button>
        <button type="button" class="tier-filter-btn tier-possible" data-tier="Possible">Possible</button>
        <button type="button" class="tier-filter-btn tier-weak" data-tier="Weak">Weak</button>
        <button type="button" class="tier-filter-btn tier-unscored" data-tier="Unscored">Unscored</button>
        <button type="button" class="tier-filter-btn tier-unclear" data-tier="Unclear">Unclear</button>
      </div>
      <div id="job-owner-filters"></div>
      <label id="job-sort-label">
        Sort
        <select id="job-sort-select">
          <option value="tier" selected>Best fit first</option>
          <option value="newest">Newest first</option>
        </select>
      </label>
    </div>
    <p id="job-filter-count" class="note"></p>

    <button id="bulk-generate-btn" type="button" class="add-toggle secondary">
      Generate Resumes for Filtered Jobs
    </button>

    <div id="job-rows"></div>
  </div>

  <div id="bulk-resume-modal" class="modal-overlay hidden">
    <div class="modal" id="bulk-resume-modal-box">
      <button id="bulk-resume-modal-close" class="modal-close">&times;</button>
      <h3>Generate resumes for these jobs?</h3>
      <p class="note" id="bulk-resume-modal-count"></p>
      <ul id="bulk-resume-job-list" class="bulk-resume-job-list"></ul>
      <div id="bulk-resume-progress" class="hidden">
        <p id="bulk-resume-progress-text" class="note"></p>
        <div class="progress-bar"><div id="bulk-resume-progress-fill" class="progress-bar-fill"></div></div>
        <ul id="bulk-resume-results" class="bulk-resume-results"></ul>
      </div>
      <div class="modal-actions">
        <button id="bulk-resume-confirm" type="button">Generate</button>
        <button id="bulk-resume-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div id="app-version"></div>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="/nav.js"></script>
  <script src="/jobs.js"></script>
  <script src="/version.js"></script>
</body>
</html>
